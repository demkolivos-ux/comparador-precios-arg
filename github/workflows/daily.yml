name: Scraper Diario de Precios

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC = 06:00 AM Argentina
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add precios_hoy.json
          git commit -m "Actualización diaria de precios" || exit 0
          git push
